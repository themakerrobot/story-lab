name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 디자인 킷 복사본이 원본(themakerrobot/themaker-ui)과 같은지. 고칠 것이 있으면 킷을 고치고 다시 복사한다
      - name: Design kit
        run: |
          KIT=v1.4.0
          curl -sSfL -o /tmp/kit.css "https://raw.githubusercontent.com/themakerrobot/themaker-ui/$KIT/themaker-ui.css"
          diff -u /tmp/kit.css css/themaker-ui.css
      # 배포본: 테스트·문서·개발 파일만 빼고 전부 (목록을 나열하면 새 폴더가 빠지는 일이 생긴다)
      - name: Build site
        run: |
          mkdir _site
          git archive HEAD -- . ':!tests' ':!.github' ':!README.md' ':!.gitignore' | tar -x -C _site
          ls _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      # 배포할 파일 그대로 띄워서 확인한다 (빠진 파일이 있으면 오프라인·콘솔 오류 테스트에서 걸린다)
      - name: Test (built site)
        run: STORYLAB_ROOT=_site node tests/run.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
